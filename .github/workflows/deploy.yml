# Builds the app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the GitHub repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Project sites live at https://<owner>.github.io/<repo>/, so the base
      # href must be "/<repo>/". If you add a custom domain (CNAME), set the
      # repository variable BASE_HREF to "/" instead.
      - name: Build
        run: npm run build -- --base-href "${BASE_HREF:-/${{ github.event.repository.name }}/}"
        env:
          BASE_HREF: ${{ vars.BASE_HREF }}

      # Serve the app for unknown paths too (single-page app).
      - run: cp dist/angular-app/browser/index.html dist/angular-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
